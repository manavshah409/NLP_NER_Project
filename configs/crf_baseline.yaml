experiment:
  name: crf_baseline
  seed: 42
data:
  version: naamapadam_hi_crf_v1
  train_split: train_clean
  validation_split: validation_clean
  sample_size: 1000
  sample_manifest: experiments/crf/manifests/train_001k_seed42.json
  data_config: configs/data/naamapadam_hi.yaml
features:
  context_window: 1
  prefixes: [1, 2, 3]
  suffixes: [1, 2, 3]
  token_shape: true
  script_features: true
  gazetteers: false
model:
  algorithm: lbfgs
  c1: 0.1
  c2: 0.1
  max_iterations: 100
  all_possible_transitions: true
evaluation:
  primary_metric: strict_entity_micro_f1
  token_accuracy_secondary: true
  max_examples_per_category: 10
resources:
  maximum_memory_gb: null
  stop_on_memory_limit: true
  polling_seconds: 0.25
  stop_fraction: 0.9
